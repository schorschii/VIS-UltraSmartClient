[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vis-ultrasmartclient"
version = "0.3.0"
description = "Platform-independent PyQt6 desktop client for VIS with performance included"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6,<7",
    "requests>=2.32,<3",
    "requests-gssapi>=1.3,<2; sys_platform != 'win32'",
    "gssapi>=1.6,<2; sys_platform != 'win32'",
    "winkerberos>=0.9,<1; sys_platform == 'win32'",
    "truststore>=0.9,<1; sys_platform == 'win32'",
    "defusedxml>=0.7,<1",
]

[project.scripts]
ultrasmartclient = "ultrasmartclient.main:main"

[tool.setuptools.packages.find]
include = ["ultrasmartclient*"]

[tool.setuptools.package-data]
ultrasmartclient = ["assets/icons/*.svg", "assets/icons/*.png", "assets/icons/dark/*.svg"]
