name: Build and release packages

on:
  workflow_dispatch: # allow manual execution
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          sh installer/debian/build.sh --output-dir dist/debian
          dpkg-deb --info dist/debian/*.deb
          dpkg-deb --contents dist/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: package-debian
          path: dist/debian/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install . 'pyinstaller>=6,<7' Pillow
      - name: Build app and disk image
        run: |
          PYTHON=python sh installer/macos/build.sh
          version=$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' pyproject.toml)
          mv dist/macos/UltraSmartClient.dmg "dist/macos/UltraSmartClient-${version}-$(uname -m).dmg"
      - name: Smoke test packaged app
        timeout-minutes: 3
        run: dist/macos/UltraSmartClient.app/Contents/MacOS/UltraSmartClient --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/macos/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install . 'pyinstaller>=6,<7' Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Build portable executable
        run: |
          ./installer/windows/build.ps1
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not read project version' }
          Move-Item dist/windows/UltraSmartClient.exe "dist/windows/UltraSmartClient-$version-x64.exe"
      - name: Smoke test packaged executable
        timeout-minutes: 3
        run: |
          $exe = (Get-Item dist/windows/UltraSmartClient-*-x64.exe).FullName
          $process = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/windows/*.exe
          if-no-files-found: error

  release:
    needs: [debian, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      - name: Publish release with packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" ./*.{deb,dmg,exe} --clobber
          #gh release edit "$RELEASE_TAG" --draft=false
