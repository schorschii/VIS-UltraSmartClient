  release:
    needs: [debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      - name: Publish release with packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" ./*.deb --clobber
          #gh release edit "$RELEASE_TAG" --draft=false
